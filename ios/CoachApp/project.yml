name: CoachApp
options:
  bundleIdPrefix: com.expdeath
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
targets:
  CoachApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachApp
    entitlements:
      path: CoachApp/CoachApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: CoachApp/Info.plist
      properties:
        NSHealthShareUsageDescription: COACH reads your Watch data (HRV, resting heart rate, sleep, steps, VO₂max, workouts' energy) to judge recovery and plan each session.
        NSHealthUpdateUsageDescription: COACH doesn't write to Apple Health.
        UIBackgroundModes: [fetch]
        CFBundleDisplayName: COACH
        UILaunchScreen: {}
        # Google sign-in returns to the app through this URL scheme
        # (REVERSED_CLIENT_ID from GoogleService-Info.plist)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.204447158862-tdqcjtuich5bi98qif2fqjhv87is58o3
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Medium.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.expdeath.CoachApp
        SWIFT_VERSION: "5.0"
        # app code runs on the main actor unless it says otherwise — UI
        # state, the Firestore mirror and AI replies can't race each other
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETSCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Abhishek Aggarwal (Personal Team) — free Apple ID signing. Kept
        # here so `xcodegen generate` doesn't wipe the team picked in Xcode.
        DEVELOPMENT_TEAM: WFR2GPT97L
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
  CoachAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachAppTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CoachApp
  CoachAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachAppUITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CoachApp
schemes:
  CoachApp:
    build:
      targets:
        CoachApp: all
        CoachAppTests: [test]
        CoachAppUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - CoachAppTests
        - CoachAppUITests
    archive:
      config: Release
